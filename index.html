<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rifas da Dai</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎟️</text></svg>">
<style>
:root{--azul:#0b2a8f;--azul-esc:#061a5e;--azul-med:#14399f;--ouro:#f5b800;--ouro-cl:#ffe27a;--ouro-esc:#a87400;--rosa:#e8194f;--papel:#ffffff;--fundo:#f3f5fb;--tinta:#1b2140;--cinza:#5b6285;--linha:#e2e6f3}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif;background:var(--fundo);color:var(--tinta);line-height:1.55}
img{max-width:100%;display:block}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* moldura dourada (usada nas fotos e na logo) */
.moldura{background:linear-gradient(135deg,#fff3b8 0%,var(--ouro) 28%,var(--ouro-esc) 52%,var(--ouro) 74%,#fff3b8 100%);padding:8px;border-radius:22px;box-shadow:0 14px 30px rgba(6,26,94,.28),0 2px 0 rgba(255,255,255,.6) inset}
.moldura .vidro{background:#fff;border-radius:15px;padding:12px;border:2px solid rgba(122,85,0,.55);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 5px var(--linha);display:flex;align-items:center;justify-content:center}
.moldura .vidro img{max-height:100%;object-fit:contain;border-radius:6px}

header{background:radial-gradient(ellipse at 50% -10%,#2a5ee8 0%,var(--azul) 50%,var(--azul-esc) 100%);text-align:center;padding:40px 20px 70px;color:#fff;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--ouro-esc),var(--ouro-cl),var(--ouro),var(--ouro-cl),var(--ouro-esc))}
.logo{width:190px;margin:0 auto 20px;padding:6px;border-radius:38px}
.logo .vidro{padding:0;border-radius:31px;overflow:hidden;border:0;box-shadow:none;background:transparent}
.logo img{width:100%;height:auto;border-radius:0}
header h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:.3px}
header p{max-width:520px;margin:10px auto 0;color:#dbe4ff;font-size:18px}

section{padding:48px 0 8px}
h2{font-size:26px;text-align:center;color:var(--azul);margin-bottom:28px;display:flex;align-items:center;gap:16px}
h2::before,h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--ouro));border-radius:2px}
h2::after{transform:scaleX(-1)}
main section:first-child{padding-top:44px}
main section:first-child h2{display:none}

.grid{display:grid;gap:30px}
@media(min-width:780px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--papel);border-radius:24px;overflow:hidden;border:1px solid var(--linha);box-shadow:0 18px 40px rgba(11,42,143,.14);display:flex;flex-direction:column}
.card .foto{background:radial-gradient(circle at 50% 35%,#ffffff 0%,#e6ecff 70%,#d5defa 100%);padding:26px 26px 22px;height:380px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--linha)}
.card .foto .moldura{height:100%;max-width:100%}
.card .foto .vidro{height:100%}
.card .corpo{padding:22px;display:flex;flex-direction:column;gap:16px;flex:1}
.card h3{font-size:21px;line-height:1.25;color:var(--azul-esc)}
.desc{font-size:15px;color:var(--cinza)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info div{background:var(--fundo);border:1px solid var(--linha);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--cinza)}
.info b{display:block;font-size:16px;line-height:1.3;color:var(--azul-esc);margin-top:2px}
.info .preco{background:#fff4f7;border-color:#f8cfd9}
.info .preco b{color:var(--rosa);font-size:20px}
.barra{height:10px;background:var(--linha);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--ouro),var(--rosa));border-radius:99px}
.leg{font-size:13px;color:var(--cinza);display:flex;justify-content:space-between;margin-top:6px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;max-height:220px;overflow:auto;padding:10px;background:var(--fundo);border:1px solid var(--linha);border-radius:16px}
.nums button{font:inherit;font-weight:700;font-size:14px;padding:9px 0;border-radius:10px;border:1.5px solid #c5cff0;background:#fff;color:var(--azul);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.nums button:hover:not(:disabled){border-color:var(--azul);background:#eef2ff}
.nums button.sel{background:var(--azul);border-color:var(--azul);color:#fff}
.nums button.vend{background:#eceef5;border-color:#eceef5;color:#a3a8c0;cursor:not-allowed;text-decoration:line-through}
.nums button:focus-visible,.btn:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.total{font-weight:600;font-size:14.5px;text-align:center;color:var(--azul-esc)}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;font-size:17px;background:linear-gradient(180deg,#f0295f,var(--rosa));color:#fff;padding:14px;border-radius:14px;border:0;cursor:pointer;margin-top:auto;box-shadow:0 6px 16px rgba(232,25,79,.35);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn[aria-disabled=true]{background:#c9cde0;box-shadow:none;pointer-events:none}

.como{background:linear-gradient(160deg,var(--azul-med),var(--azul-esc));border-radius:24px;padding:34px 26px 36px;color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px rgba(11,42,143,.22)}
.como h2{color:#fff}
.como ol{list-style:none;counter-reset:p;max-width:640px;margin:0 auto;display:grid;gap:14px}
.como li{counter-increment:p;display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px}
.como li::before{content:counter(p);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ouro);color:var(--azul-esc);font-weight:800;display:grid;place-items:center}
footer{text-align:center;color:var(--cinza);font-size:14px;padding:34px 20px 44px}
footer a{color:var(--azul);font-weight:600}
@media(max-width:520px){.card .foto{height:320px;padding:18px}.info{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* rifa bloqueada (ativa: false) */
.card .foto{position:relative}
.tag{position:absolute;top:18px;left:-6px;z-index:2;background:linear-gradient(180deg,#f0295f,var(--rosa));color:#fff;font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase;padding:7px 18px 7px 14px;border-radius:0 10px 10px 0;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.card.off{background:#14172a;border-color:#2a2f4d;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.card.off .foto{background:radial-gradient(circle at 50% 35%,#2a2f4d 0%,#181b30 75%);border-bottom-color:#2a2f4d}
.card.off .moldura{background:linear-gradient(135deg,#6b6f85,#3a3e57 50%,#6b6f85);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.card.off .moldura .vidro{background:#0f1122;border-color:#2a2f4d;box-shadow:none}
.card.off .moldura img{filter:grayscale(1) brightness(.5) contrast(1.05)}
.card.off h3{color:#aeb3cf}
.card.off .desc,.card.off .leg,.card.off .total{color:#7d83a3}
.card.off .info div{background:#1b1f38;border-color:#2a2f4d;color:#7d83a3}
.card.off .info b,.card.off .info .preco b{color:#aeb3cf}
.card.off .barra{background:#2a2f4d}
.card.off .barra i{background:#4a4f6e}
.card.off .nums{background:#0f1122;border-color:#2a2f4d;opacity:.55;pointer-events:none}
.card.off .nums button{background:#1b1f38;border-color:#2a2f4d;color:#5d6283;cursor:not-allowed}
.card.off .btn{background:#2a2f4d;color:#8a90b0}

/* botão de tema */
.tema{position:fixed;top:14px;right:14px;z-index:50;width:46px;height:46px;border-radius:50%;border:2px solid var(--ouro);background:var(--azul-esc);color:#fff;font-size:21px;line-height:1;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35);display:grid;place-items:center}
.tema:focus-visible{outline:3px solid var(--ouro-cl);outline-offset:3px}

/* tema escuro */
html[data-tema="escuro"] body{background:#0a0e24;color:#e8ecff}
html[data-tema="escuro"] h2{color:#ffd24d}
html[data-tema="escuro"] .como h2{color:#fff}
html[data-tema="escuro"] .card:not(.off){background:#121838;border-color:#26306a;box-shadow:0 18px 40px rgba(0,0,0,.45)}
html[data-tema="escuro"] .card:not(.off) .foto{background:radial-gradient(circle at 50% 35%,#222d6e 0%,#0f1432 75%);border-bottom-color:#26306a}
html[data-tema="escuro"] .card:not(.off) h3,html[data-tema="escuro"] .card:not(.off) .info b,html[data-tema="escuro"] .card:not(.off) .total{color:#f0f3ff}
html[data-tema="escuro"] .card:not(.off) .desc,html[data-tema="escuro"] .card:not(.off) .leg,html[data-tema="escuro"] .card:not(.off) .info div{color:#9aa5d6}
html[data-tema="escuro"] .card:not(.off) .info div{background:#1a2150;border-color:#26306a}
html[data-tema="escuro"] .card:not(.off) .info .preco{background:#2c1630;border-color:#5a2147}
html[data-tema="escuro"] .card:not(.off) .info .preco b{color:#ff6f95}
html[data-tema="escuro"] .card:not(.off) .barra{background:#26306a}
html[data-tema="escuro"] .card:not(.off) .nums{background:#0d1230;border-color:#26306a}
html[data-tema="escuro"] .card:not(.off) .nums button{background:#1a2150;border-color:#34408a;color:#cfd9ff}
html[data-tema="escuro"] .card:not(.off) .nums button:hover:not(:disabled){background:#243070;border-color:#8fb0ff}
html[data-tema="escuro"] .card:not(.off) .nums button.sel{background:var(--ouro);border-color:var(--ouro);color:#061a5e}
html[data-tema="escuro"] .card:not(.off) .nums button.vend{background:#141a3a;border-color:#141a3a;color:#4b5588}
html[data-tema="escuro"] .card:not(.off) .btn[aria-disabled=true]{background:#2a3266;color:#8a94c8}
html[data-tema="escuro"] .card.off{background:#0c0d16;border-color:#1c1e30}
html[data-tema="escuro"] footer{color:#9aa5d6}
html[data-tema="escuro"] footer a{color:#8fb0ff}
</style>
<script>
/* aplica o tema salvo (ou o do aparelho) antes da página aparecer */
(function(){var t=null;try{t=localStorage.getItem("tema")}catch(e){}
if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="escuro";
if(t==="escuro")document.documentElement.setAttribute("data-tema","escuro")})();
</script>
</head>

<script>
const $ = (s, el=document) => el.querySelector(s);
const pad = n => String(n).padStart(2, "0");

function montarRifa(r, idx){
  const vend = new Set(r.vendidos), sel = new Set();
  const off = r.ativa === false;
  const pct = Math.round(vend.size / r.totalNumeros * 100);
  const card = document.createElement("article");
  card.className = "card" + (off ? " off" : "");
  card.innerHTML = `
    <div class="foto">${off ? `<span class="tag">${r.etiqueta || "Em breve"}</span>` : ""}<div class="moldura"><div class="vidro"><img src="${IMAGENS[r.imagem] || ""}" alt="${r.nome}"></div></div></div>
    <div class="corpo">
      <h3>${r.nome}</h3>
      <p class="desc">${r.descricao}</p>
      <div class="info">
        <div>Prêmio <b>${r.valorPremio}</b></div>
        <div class="preco">Cada número<b>${r.precoNumero}</b></div>
        <div>Data do sorteio<b>${r.dataSorteio}</b></div>
        <div>Resultado por<b>${r.sorteioPor}</b></div>
      </div>
      <div>
        <div class="barra"><i style="width:${pct}%"></i></div>
        <div class="leg"><span>${vend.size} de ${r.totalNumeros} vendidos</span><span>${r.totalNumeros - vend.size} livres</span></div>
      </div>
      <div class="nums" role="group" aria-label="Números disponíveis"></div>
      <p class="total">${off ? "Os números serão liberados quando a rifa começar" : "Nenhum número escolhido"}</p>
      <a class="btn" aria-disabled="true" href="#" target="_blank" rel="noopener">${off ? (r.etiqueta || "Em breve") : "Reservar pelo WhatsApp"}</a>
    </div>`;
  const nums = $(".nums", card), total = $(".total", card), btn = $(".btn", card);
  for(let n = 1; n <= r.totalNumeros; n++){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = pad(n);
    if(off){ b.disabled = true; b.title = "Rifa ainda não começou"; }
    else if(vend.has(n)){ b.className = "vend"; b.disabled = true; b.title = "Vendido"; }
    else b.onclick = () => {
      sel.has(n) ? sel.delete(n) : sel.add(n);
      b.classList.toggle("sel");
      b.setAttribute("aria-pressed", sel.has(n));
      atualizar();
    };
    nums.appendChild(b);
  }
  function atualizar(){
    const lista = [...sel].sort((a,b)=>a-b).map(pad);
    if(!lista.length){
      total.textContent = "Nenhum número escolhido";
      btn.setAttribute("aria-disabled","true"); btn.href = "#"; return;
    }
    total.textContent = `Números: ${lista.join(", ")} (${lista.length} × ${r.precoNumero})`;
    const msg = `Oi Dai! Quero reservar na rifa "${r.nome}" os números: ${lista.join(", ")}.`;
    btn.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
    btn.setAttribute("aria-disabled","false");
  }
  return card;
}

document.addEventListener("DOMContentLoaded", () => {
  const raiz = document.documentElement, btnTema = $("#tema");
  const mostrarIcone = () => { const e = raiz.getAttribute("data-tema") === "escuro"; btnTema.textContent = e ? "☀️" : "🌙"; btnTema.title = e ? "Tema claro" : "Tema escuro"; };
  mostrarIcone();
  btnTema.onclick = () => {
    const novo = raiz.getAttribute("data-tema") === "escuro" ? "claro" : "escuro";
    novo === "escuro" ? raiz.setAttribute("data-tema","escuro") : raiz.removeAttribute("data-tema");
    try{ localStorage.setItem("tema", novo); }catch(e){}
    mostrarIcone();
  };
  CONFIG.rifas.forEach((r,i) => $("#rifas").appendChild(montarRifa(r,i)));
  CONFIG.passos.forEach(p => { const li = document.createElement("li"); li.textContent = p; $("#passos").appendChild(li); });
  $("#rodape").innerHTML = "© Rifas da Dai · Sorte e alegria!" +
    (CONFIG.instagram ? ` · <a href="https://instagram.com/${CONFIG.instagram}" target="_blank" rel="noopener">@${CONFIG.instagram}</a>` : "");
});
</script>
